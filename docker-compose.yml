services:
  postgres:
    image: postgres:16-alpine
    container_name: bifrost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost
      POSTGRES_DB: bifrost
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # every .sql here runs automatically on first boot
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
